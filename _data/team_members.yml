- name: "Amir Hossein Bakhtiari"
  photo: rock.jpg
  info: Amir Hossein Bakhtiari completed his M.Sc. in Computer Engineering – Artificial Intelligence at Kharazmi University under the supervision of Professor Azadeh Mansouri. His master’s thesis, “No-reference Video Quality Assessment Using Deep Neural Networks,” focused on developing deep-learning–based methods for no-reference video quality assessment. During his M.Sc. studies, he conducted research in Video Quality Assessment with an emphasis on deep neural architectures and learning-based perceptual metrics.
He is currently pursuing a Ph.D. in Computer Engineering at Queen’s University in Kingston, where his research focuses on video action recognition and deformable linear objects perception.
